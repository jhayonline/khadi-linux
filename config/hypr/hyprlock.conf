# GENERATED by khadi-theme from themes/tron.toml — edit templates/hypr/hyprlock.conf.tmpl, not this file.
# Khadi — hyprlock. The lock screen.
#
# THEMED, NOT REPLACED. khadi-greet exists because nothing off the shelf could
# draw the design language on a login screen. A lock screen is a different
# calculation: it is the thing standing between a locked machine and its data,
# hyprlock is purpose-built for ext-session-lock-v1 and handles the protocol's
# failure modes, and PLAN.md section 12 says to resist every feature that moves
# work from upstream to Khadi. That applies hardest here.
#
# So this is a config, and hyprlock turns out to be able to carry the motifs:
# it renders labels through pango with a real font, so the ticked hairline is
# just text — the same trick the TUI uses, and the one the boot splash could
# NOT use because an initramfs has no pango (PLAN.md section 10m).
#
# THE COMPOSITION. Corners carry identity, the centre carries state. KHADI and
# LOCKED above, the machine and its keyboard below, and between them the clock,
# the field, and the three facts worth having from across the room. The first
# version had the corners and the clock and nothing else, so two thirds of the
# screen was empty and the surface read as a screensaver rather than as the
# same instrument the panels are.
#
# WHAT IT IS ALLOWED TO SAY is in khadi/lockinfo.sh, with the reasoning. The
# short version: a locked screen is read by someone unverified, so no address,
# no username, no trace of what was on screen.

$font = Iosevka Term
$info = sh ~/.config/khadi/lockinfo.sh

general {
    hide_cursor = true
}

animations {
    # eDEX does not fade. It also means the lock appears the instant the key is
    # pressed, which is the one place where a pretty transition is a liability.
    enabled = false
}

background {
    monitor =
    # Flat ground, not a blurred screenshot of the desktop. A blur is a
    # different design language, and it also leaves a readable impression of
    # whatever was on screen when you walked away.
    color = rgba(05080dff)
}

# ---------------------------------------------------------------- the frame
#
# The ticked hairline, full bleed, as a shape rather than as text. Everywhere
# else in Khadi the rule is the literal characters `┬───┬`, which only works
# when the width is known in cells. Here it has to span a monitor nobody has
# measured yet, so the bar is a 1px shape at 100% width and each tick is a 1px
# shape pinned to an edge — the same geometry, built from the same two parts.
#
# The ticks on the bottom rule point UP. They hung down at first, which made
# the foot of the screen a second ┬───┬ instead of the ┴───┴ that closes it.

shape {
    monitor =
    size = 100%, 1
    color = rgba(364448ff)
    rounding = 0
    border_size = 0
    position = 0, -46
    halign = center
    valign = top
}
shape {
    monitor =
    size = 1, 7
    color = rgba(364448ff)
    rounding = 0
    border_size = 0
    position = 0, -46
    halign = left
    valign = top
}
shape {
    monitor =
    size = 1, 7
    color = rgba(364448ff)
    rounding = 0
    border_size = 0
    position = 0, -46
    halign = right
    valign = top
}

shape {
    monitor =
    size = 100%, 1
    color = rgba(364448ff)
    rounding = 0
    border_size = 0
    position = 0, 46
    halign = center
    valign = bottom
}
shape {
    monitor =
    size = 1, 7
    color = rgba(364448ff)
    rounding = 0
    border_size = 0
    position = 0, 46
    halign = left
    valign = bottom
}
shape {
    monitor =
    size = 1, 7
    color = rgba(364448ff)
    rounding = 0
    border_size = 0
    position = 0, 46
    halign = right
    valign = bottom
}

# --------------------------------------------------------------- the corners

label {
    monitor =
    text = KHADI
    color = rgba(aacfd1ff)
    font_size = 14
    font_family = $font
    position = 24, -20
    halign = left
    valign = top
}

label {
    monitor =
    text = LOCKED
    color = rgba(89a7aaff)
    font_size = 14
    font_family = $font
    position = -24, -20
    halign = right
    valign = top
}

# Which machine this is. The panels put the hostname in the HARDWARE header;
# here it is the one piece of identity a stranger gains nothing from and the
# owner, walking up to one of several machines, wants first.
#
# Dimmer than KHADI above it. The top pair names the surface and the bottom
# pair reports on the machine, and at equal weight the hostname read as a
# second wordmark.
label {
    monitor =
    text = cmd[update:0] $info host
    color = rgba(89a7aaff)
    font_size = 14
    font_family = $font
    position = 24, 18
    halign = left
    valign = bottom
}

# The keyboard layout, because a rejected password is a layout problem about as
# often as it is a typo, and nothing else on the screen can tell you.
label {
    monitor =
    text = $LAYOUT
    color = rgba(586c6fff)
    font_size = 14
    font_family = $font
    position = -24, 18
    halign = right
    valign = bottom
}

# ----------------------------------------------------------------- the clock
#
# NOT the seven-segment digits the panel and the greeter use, and that is a
# measured decision rather than an oversight.
#
# Those are drawn one glyph per cell, which works where a cell is exactly as
# wide as half its height — a terminal grid, and the VT the greeter runs on.
# hyprlock renders through pango, which adds leading between lines and exposes
# no way to remove it, so every cell becomes a wide rectangle with a gap under
# it and the digits come out as crude bars. Doubling the width to compensate
# only trades one distortion for another; it was tried and photographed.
#
# A large clock in the same face is clean, and the surface is still
# unmistakably Khadi from the ground, the rules, the corner pairs and the font.
# It carries seconds now, as the panel and the greeter do: a clock that does
# not move is a picture of a clock, and this is the surface most likely to be
# looked at from a distance to see whether the machine is still alive.
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M:%S"
    color = rgba(aacfd1ff)
    font_size = 96
    font_family = $font
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%a %d %b %Y" | tr a-z A-Z
    color = rgba(586c6fff)
    font_size = 13
    font_family = $font
    position = 0, 24
    halign = center
    valign = center
}

# The inner bracket. Text, not a shape: this one has a width in cells, so it can
# be the same characters khadi-hud draws.
label {
    monitor =
    text = ┬──────────────────────────────────────┬
    color = rgba(364448ff)
    font_size = 13
    font_family = $font
    position = 0, -14
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 380, 42
    # No rounding and a hairline outline: eDEX has no rounded anything and no
    # shadows, and softening either reads as a different design language.
    rounding = 0
    outline_thickness = 1
    inner_color = rgba(05080dff)
    outer_color = rgba(364448ff)
    check_color = rgba(687f83ff)
    fail_color = rgba(586c6fff)
    # Caps lock gets the full accent, which is the brightest the palette goes.
    # It is the one state the field can report that the typist can actually
    # act on, and the alternative is watching a correct password be refused.
    capslock_color = rgba(aacfd1ff)
    font_color = rgba(aacfd1ff)
    font_family = $font
    placeholder_text = PASSWORD
    # What failed, and how many times. The count is the part that says whether
    # this is a slipped finger or the wrong machine.
    fail_text = $PAMFAIL — ATTEMPT $ATTEMPTS
    # The password as its length and nothing else, in the same block the
    # greeter uses.
    dots_text_format = █
    dots_size = 0.25
    dots_spacing = 0.3
    fade_on_empty = false
    position = 0, -76
    halign = center
    valign = center
}

# ------------------------------------------------------------- the state band
#
# The panels' label-over-value cell, three across. Centred rather than flush
# left, because this band floats in open space instead of sitting in a column.

label {
    monitor =
    text = UPTIME
    color = rgba(586c6fff)
    font_size = 12
    font_family = $font
    position = -160, -148
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] $info uptime
    color = rgba(89a7aaff)
    font_size = 13
    font_family = $font
    position = -160, -172
    halign = center
    valign = center
}

label {
