# GENERATED by khadi-theme from themes/tron.toml — edit templates/hypr/hyprland.conf.tmpl, not this file.
# Khadi — Hyprland config.
# Derived from themes/tron.toml. Phase 2 generates this file.
#
# Khadi is PANE-CENTRIC (PLAN.md section 6): the default workspace is one
# terminal running a zellij layout, and most work happens inside it. The
# compositor's job is to put that terminal on screen and get out of the way.
# Windows exist for browsers and graphical apps, not for terminals.

# PATH. A greetd-launched session does not source ~/.bash_profile, so the
# installer's shell-profile fix covers terminals but NOT the session itself —
# khadi-panel was unfindable and the zellij layout's side panels could not
# spawn. Found by the Phase 1 gate once greetd replaced the autologin hack.
# Hyprland has no append syntax, so the Arch default path is spelled out.
env = PATH,$HOME/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/bin:/usr/bin/site_perl:/usr/bin/vendor_perl:/usr/bin/core_perl

monitor = , preferred, auto, 1

# ---------------------------------------------------------------- startup --
# Logged, because a failing exec-once is otherwise completely silent — the
# session just comes up without a terminal and nothing says why.
# THE SESSION IS khadi-shell. It was `foot -e zellij -n khadi`, which tiled
# three khadi-hud panels around a shell; khadi-hud is gone and the shell draws
# all of it in one window now. See PLAN.md section 10r.
#
# NO WEBKIT_DISABLE_DMABUF_RENDERER HERE. It was set globally for one release
# and it is the single most expensive thing that was wrong with the shell:
# turning off the DMABUF path makes webkit composite in software, so every
# frame the webview draws goes through the CPU. It is needed on llvmpipe, which
# is what the VM runs, and nowhere else — so the VM sets it for itself and real
# hardware keeps its GPU. If the shell comes up as a blank window on your
# machine, that is the knob:
#
#     WEBKIT_DISABLE_DMABUF_RENDERER=1 khadi-shell
exec-once = khadi-shell 2>$HOME/.cache/khadi-session.log
exec-once = mako
# khadi-bar replaces waybar (Phase 3b). It carries the two motifs a cell grid
# cannot: the faithful sub-pixel bracket tick and the skewX(35deg) tab bar.
exec-once = khadi-bar 2>$HOME/.cache/khadi-bar.log
# Idle. Without this the lock screen only protects a machine you remembered to
# lock. Config in hypridle.conf, including why it does not suspend.
exec-once = hypridle 2>$HOME/.cache/khadi-idle.log

# GUI APPS. Khadi is terminal-first, not terminal-only — PLAN.md section 6 is
# explicit that windows exist for browsers and graphical apps. Two lines are
# what make those apps work rather than half-work.
#
# The portal is started on demand by D-Bus, and it inherits the activation
# environment, NOT the session's. Without this it comes up not knowing which
# compositor it is talking to: a file picker opens nothing and a screen share
# fails, both silently, which is the worst kind of broken.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
# libadwaita does not read gtk-application-prefer-dark-theme. It asks the
# Settings portal, which reads gsettings — so the settings.ini files alone
# leave every modern GNOME app blazing white on a near-black desktop.
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

# ------------------------------------------------------------------ input --
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

# ------------------------------------------------------------------ look ---
# Gaps are deliberately small. The reference layout needs >=180 usable columns
# and >=247 for eDEX proportions (PLAN.md section 10); at 1920x1080 with
# Iosevka Term size 10 that budget is 288 raw, 284 after this chrome. Every
# pixel of gap is columns the panels do not get.
general {
    gaps_in = 2
    gaps_out = 4
    border_size = 1
    col.active_border = rgb(aacfd1)
    col.inactive_border = rgb(364448)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 0          # eDEX has no rounded anything
    blur {
        enabled = false   # terminal-first; blur costs frames and buys nothing
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = snap, 0.4, 0, 1, 1      # eDEX's own cubic-bezier, from main.css
    animation = windows, 1, 2, snap
    animation = fade, 1, 2, snap
    animation = workspaces, 1, 2, snap
    animation = border, 1, 3, snap
}

dwindle {
    # pseudotile was removed as a dwindle option in Hyprland 0.56; it is a
    # window state now, reachable via a dispatcher if ever wanted.
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    # THE BACKGROUND IS PART OF THE DESIGN. `disable_hyprland_logo` removes
    # the logo and leaves the default lilac gradient behind it, which showed
    # through `gaps_out` as a coloured frame around the entire desktop — the
    # single most off-brand thing on the screen, and photographed before it
    # was noticed. eDEX's ground is flat `light_black` edge to edge.
    background_color = rgb(05080d)
}

# -------------------------------------------------------------- keybinds ---
# KEYBOARD MODEL, PLAN.md section 6: each layer owns ONE modifier, exclusively.
#   Hyprland    Super        workspaces, windows, launcher, lock, screenshot
#   zellij      Alt          panes and tabs
#   terminal    Ctrl+Shift   font size, copy, paste
#   application Ctrl + own   everything else, untouched
# Nothing below may use Alt or bare Ctrl.

$mod = SUPER

# Return is a REAL terminal. The shell embeds xterm.js, which is good enough
# to live in and not good enough for a kernel build scrolling past; foot is one
# key away and stays the answer for anything that moves fast.
bind = $mod, Return, exec, foot
bind = $mod, T,      exec, khadi-shell   # bring the shell back if it was closed
bind = $mod, B,      exec, chromium
bind = $mod, E,      exec, foot -e yazi
bind = $mod, Space,  exec, fuzzel
bind = $mod, Q,      killactive
bind = $mod SHIFT, E, exit

# Focus. Vim keys and arrows both, because discoverability is a product
# requirement and not everyone arrives knowing hjkl.
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod, left,  movefocus, l
bind = $mod, down,  movefocus, d
bind = $mod, up,    movefocus, u
bind = $mod, right, movefocus, r

bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# F toggles fullscreen. This is the documented mitigation for "chrome eats the
# screen" (PLAN.md section 11): the aesthetic must always be dismissible.
bind = $mod, F, fullscreen, 0
bind = $mod, V, togglefloating

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Discoverability: a keyboard-driven system with hidden bindings is a toy.
bind = $mod, slash, exec, foot -a khadi-cheatsheet -e khadi-cheatsheet

bind = $mod, P, exec, grim -g "$(slurp)" - | wl-copy
bind = $mod SHIFT, X, exec, hyprlock

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ----------------------------------------------------------------- rules ---
# The cheatsheet overlay wants: float, 640x560, centred.
#
# Hyprland 0.56 deprecated `windowrulev2` and its replacement accepts only
# `tag` and `content` as matchers — matching by class needs a tag, and setting
# a tag needs a class, which is circular. The whole `.conf` format is removed
# in 0.57, so this is a transitional syntax not worth reverse-engineering.
# Revisit as part of the 0.57 config migration; until then the cheatsheet
# tiles, which is perfectly readable.
#
# Tracked in PLAN.md section 10b.
