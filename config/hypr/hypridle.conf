# GENERATED by khadi-theme from themes/tron.toml — edit templates/hypr/hypridle.conf.tmpl, not this file.
# Khadi — hypridle. What happens when you walk away.
#
# Until now nothing locked on its own: Super+Shift+X was the only way in, which
# means the lock screen protected a machine you remembered to lock.
#
# NOTE THE DISPATCH SYNTAX, and do not copy it from hypridle's own example.
#
# Hyprland 0.56 added a Lua config manager, and `hyprctl dispatch` follows
# whichever config manager is active — Lua form for a Lua config, classic form
# for a classic one. Khadi's hyprland.conf is classic, so classic is correct
# here. hypridle 0.1.8 ships an example using the Lua form; on this config it
# returns "Invalid dispatcher" and the screen simply never turns off, with
# nothing in any log. Measured both ways in the VM (PLAN.md section 10p).
#
# THE LOCK PATH GOES THROUGH logind, deliberately. A listener calls
# `loginctl lock-session`, logind emits Lock, hypridle catches it and runs
# lock_cmd. That means `loginctl lock-session` from anywhere — a script, a
# laptop lid, another tool — locks the same way the timeout does, instead of
# there being one path that works and one that does nothing.

general {
    # `pidof` first: without the guard a second lock screen stacks on the
    # first, and dismissing one leaves you looking at the other.
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Lock at ten minutes. Short enough to be a lock, long enough to read a page of
# output without being thrown out of your own machine.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Screen off a minute later, so the lock is visible for a moment first rather
# than the display dying with no explanation.
listener {
    timeout = 660
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# NO AUTOMATIC SUSPEND, and no backlight dimming.
#
# Suspend is the default everyone ships and it is wrong for this desktop: a
# terminal-first machine is routinely left running a build, a VM, a long ssh
# session. Suspending that because nobody touched the keyboard for half an hour
# loses work, and the loss is silent. Add it here if your machine is a laptop
# you close:
#
#     listener {
#         timeout = 1800
#         on-timeout = systemctl suspend
#     }
#
# Dimming needs `brightnessctl`, which is not in the manifest — a config that
# calls a program Khadi does not install is the chromium bug (section 10j), so
# it is left out rather than left broken.
