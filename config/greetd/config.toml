# GENERATED by khadi-theme from themes/tron.toml — edit templates/greetd/config.toml.tmpl, not this file.
# Khadi — greetd. Installed to /etc/greetd/config.toml (system-level, needs root).
#
# A text-mode greeter is the right login surface for a terminal-first desktop:
# it matches the aesthetic and it is keyboard-only by construction. It also
# fixes Hyprland's "started without start-hyprland, strongly discouraged"
# warning, because the session launches through the shipped wrapper rather
# than bare Hyprland from a shell profile.
#
# IT USED TO RUN ON A BARE VT, which has sixteen ANSI colours. khadi-greet
# repainted the console palette from the theme ramp to survive that, and built
# its clock out of box characters because a VT has one font at one size. Both
# were good answers to the wrong question: the question was why the login
# screen was the only surface wearing a different face from the desktop.
#
# `cage` is a Wayland kiosk compositor — one window, fullscreen, no decoration,
# no way out of it — and it is in the Arch repos. Under it, `khadi-shell
# --greeter` is the same binary and the same stylesheet as the desktop, so the
# login screen matches by construction rather than by being re-themed.
#
# NOT QUICKSHELL, which was the other candidate and is also in the repos. It
# would have meant QML as a third UI language and ~150 MB of Qt for one
# screen, on a desktop that had just gone from three UI stacks down to one.
#
# THE GREETER'S COMMAND LIST IS SHORT ON PURPOSE. `--greeter` registers its own
# Tauri handler: the theme, greetd's five calls and the hostname. The desktop's
# `pty_spawn` is not merely unused there, it is not registered — a pre-auth
# shell as the `greeter` user is not something to leave one IPC call away.
#
# TWO ENVIRONMENT VARIABLES ARE NEEDED HERE and they are NOT in this file:
# `khadi-shell --greeter` sets HOME and WEBKIT_DISABLE_DMABUF_RENDERER itself,
# with the reasons at the top of shell/src-tauri/src/main.rs. They were an
# `sh -c` wrapper around this command for one iteration, until khadi-check
# pointed out that "what the config launches" had become `sh`.
#
# IF IT WILL NOT START, greetd ships `agreety`, and the recovery is one line
# here:  command = "agreety --cmd start-hyprland"

[terminal]
vt = 1

[default_session]
# Installed to /usr/local/bin by `khadi-install --system`: the greeter runs as
# the `greeter` user, which cannot read a home directory, so a link into
# ~/.local/bin would be unreachable. Same reason the theme is copied to
# /etc/khadi/theme.toml.
command = "cage -s -- khadi-shell --greeter --cmd start-hyprland"
user = "greeter"
