# GENERATED by khadi-theme from themes/tron.toml — edit templates/yazi/theme.toml.tmpl, not this file.
# Khadi — yazi theme. Derived from themes/tron.toml.
# Phase 2 generates this file. Schema: yazi v26.9.1 theme-dark.toml.
#
# yazi loads its own theme-dark.toml first; this file overrides parts of it.
#
# ONE-COLOUR DESIGN. tron.json defines no ANSI 16, so there is no palette to
# colour file types with. Rather than invent hues the rest of the system does
# not have, every rule collapses onto the flattened alpha ramp: brighter means
# more important, never "this is an archive". This is the documented cost of
# the one-colour theme (PLAN.md section 3), applied deliberately.

[mgr]
cwd = { fg = "#aacfd1" }

find_keyword  = { fg = "#aacfd1", bold = true, underline = true }
find_position = { fg = "#89a7aa", bg = "reset", bold = true }

symlink_target = { fg = "#586c6f", italic = true }

marker_copied   = { fg = "#687f83", bg = "#687f83" }
marker_cut      = { fg = "#9abbbd", bg = "#9abbbd" }
marker_marked   = { fg = "#aacfd1",   bg = "#aacfd1" }
marker_selected = { fg = "#89a7aa", bg = "#89a7aa" }
marker_symbol   = "│"

count_copied   = { fg = "#05080d", bg = "#687f83" }
count_cut      = { fg = "#05080d", bg = "#9abbbd" }
count_selected = { fg = "#05080d", bg = "#89a7aa" }

# The hairline. Same rule colour as every other surface in Khadi.
border_symbol = "│"
border_style  = { fg = "#364448" }

[tabs]
active   = { fg = "#05080d", bg = "#aacfd1", bold = true }
inactive = { fg = "#586c6f", bg = "#263034" }
# eDEX tabs are skewed parallelograms (chrome.tab_skew_deg). A cell grid
# cannot skew, so the separators stay empty rather than faking it with
# powerline wedges, which would import a different design language.
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#05080d", bg = "#aacfd1",   bold = true }
normal_alt  = { fg = "#aacfd1",   bg = "#364448" }
select_main = { fg = "#05080d", bg = "#89a7aa", bold = true }
select_alt  = { fg = "#89a7aa", bg = "#364448" }
unset_main  = { fg = "#05080d", bg = "#586c6f", bold = true }
unset_alt   = { fg = "#586c6f", bg = "#364448" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_sep   = { fg = "#364448" }
perm_type  = { fg = "#89a7aa" }
perm_read  = { fg = "#789396" }
perm_write = { fg = "#789396" }
perm_exec  = { fg = "#aacfd1" }

progress_label  = { fg = "#aacfd1", bold = true }
progress_normal = { fg = "#aacfd1", bg = "#364448" }
progress_error  = { fg = "#05080d", bg = "#9abbbd" }

[input]
border   = { fg = "#364448" }
title    = { fg = "#aacfd1" }
value    = { fg = "#aacfd1" }
selected = { bg = "#364448" }

[pick]
border   = { fg = "#364448" }
active   = { fg = "#aacfd1", bold = true }
inactive = { fg = "#586c6f" }

[confirm]
border     = { fg = "#364448" }
title      = { fg = "#aacfd1" }
body       = { fg = "#89a7aa" }
list       = { fg = "#89a7aa" }
btn_yes    = { fg = "#05080d", bg = "#aacfd1" }
btn_no     = { fg = "#586c6f" }
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[cmp]
border   = { fg = "#364448" }
active   = { fg = "#aacfd1", bold = true }
inactive = { fg = "#586c6f" }

[tasks]
border  = { fg = "#364448" }
title   = { fg = "#aacfd1" }
hovered = { fg = "#aacfd1", underline = true }

[which]
cols            = 3
mask            = { bg = "#05080d" }
cand            = { fg = "#aacfd1" }
rest            = { fg = "#586c6f" }
desc            = { fg = "#89a7aa" }
separator       = "  ·  "
separator_style = { fg = "#364448" }

[help]
border  = { fg = "#364448" }
chord   = { fg = "#aacfd1" }
action  = { fg = "#89a7aa" }
hovered = { bg = "#364448", bold = true }

[notify]
title_info  = { fg = "#aacfd1" }
title_warn  = { fg = "#89a7aa" }
title_error = { fg = "#9abbbd" }

[spot]
border = { fg = "#364448" }
title  = { fg = "#aacfd1" }

[filetype]
rules = [
	# Brightness carries importance, not file type. See the note at the top.
	{ url = "*/", fg = "#aacfd1" },                   # directories, brightest
	{ url = "*", is = "exec", fg = "#9abbbd" },
	{ url = "*", is = "orphan", fg = "#47585b" },
	{ mime = "vfs/{absent,stale}", fg = "#47585b" },
	{ url = "*", fg = "#89a7aa" },                # everything else
]

[indicator]
# The hovered row. Upstream wraps it in Powerline wedges:
#   padding = { open = "\ue0b6", close = "\ue0b4" }
# Those are Private-Use-Area glyphs needing a Nerd Font, which Khadi's locked
# Iosevka Term is not — they would be tofu on a clean Arch install. They also
# import a different design language: eDEX has no rounded anything
# (chrome, section 3). A plain space reads as a block highlight instead.
parent  = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = " ", close = " " }

[icon]
# yazi ships 725 icon rules, each with a hardcoded Material Design hex colour
# (#03a9f4, #8bc34a, #ff9800 ...). Two problems with that here:
#
#   1. It floods a ONE-COLOUR design with ~20 imported hues. Measured: four
#      non-Khadi colours were reaching the screen before this override.
#   2. The glyphs need a Nerd Font. Khadi's locked mono is Iosevka Term, which
#      is not one, and ttf-iosevkaterm-nerd is 1141 MiB. On a clean Arch
#      install the icons would render as tofu — a Phase 1 gate failure.
#
# So: no icons. Consistent with [filetype] above, where brightness carries
# importance rather than category. eDEX's own file icons live in its GUI
# panel; the terminal surface does not need them.
globs = []
dirs  = []
files = []
exts  = []
conds = []
