[package]
name = "edex-comp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Wayland compositor for the DEs-UI desktop"

[dependencies]
edex-common = { path = "../common" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_udev",
    "backend_libinput",
    "backend_session_libseat",
    "renderer_gl",
    "xwayland",
    "wayland_frontend",
    "desktop",
]
