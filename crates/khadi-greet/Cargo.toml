# khadi-greet — the login screen.
#
# A greeter rather than configuring tuigreet further, for the same reason
# khadi-hud exists: nothing off the shelf carries the design language. tuigreet
# themes its colours and draws a box; it cannot draw the bracket-tick header or
# the block clock, and the login screen is the first thing seen after the
# splash and the thing seen most often after that.
#
# It depends on khadi-hud for those widgets. A second implementation of either
# would be a second thing to keep in step with the design.
[package]
name = "khadi-greet"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "khadi-greet"
path = "src/main.rs"

[dependencies]
khadi-core = { path = "../khadi-core" }
khadi-hud  = { path = "../khadi-hud" }
anyhow.workspace = true
serde.workspace = true
serde_json = "1"
ratatui = "0.30"
crossterm = "0.29"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
