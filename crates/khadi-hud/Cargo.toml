[package]
name = "khadi-hud"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "khadi-hud"
path = "src/main.rs"

[dependencies]
khadi-core = { path = "../khadi-core" }
anyhow.workspace = true
ratatui = "0.30"
crossterm = "0.29"
# Local time. Hand-rolling a UTC offset "worked" only because the development
# machine sits in Africa/Accra (UTC+0); it would have been silently wrong for
# almost every other user. The clock is the most prominent element on the
# panel, so it gets a real tz database rather than an env var.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
