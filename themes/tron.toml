# Khadi theme — tron
#
# INPUTS ONLY. The flattened alpha ramp, the semantic roles and the terminal
# block are DERIVED by bin/khadi-theme, not stored here. Storing them was the
# Phase 1 arrangement and it meant a new theme needed seventeen values worked
# out by hand — the opposite of a single source of truth.
#
#   khadi-theme show tron     see everything, derived included
#   khadi-theme build tron    render templates/ -> config/
#
# Ported from eDEX-UI: src/assets/themes/tron.json plus the constants that
# recur across src/assets/css/*.css.

[meta]
name        = "tron"
description = "eDEX-UI's default. Pale cyan on near-black."
upstream    = "eDEX-UI src/assets/themes/tron.json (GPL-3.0)"

# ---------------------------------------------------------------------------
# Palette — the only colours a theme must state.
#
# eDEX is a ONE-COLOUR design. A single accent paints every glyph and every
# rule; depth comes entirely from alpha over the background, never from more
# hues. All 21 upstream themes share this shape, which is why four values are
# enough. khadi-theme flattens the alpha ramp against `background`, because
# terminals cannot do transparency.
# ---------------------------------------------------------------------------
[palette]
accent     = "#aacfd1"  # PORTED  rgb(170,207,209)
black      = "#000000"  # PORTED  deepest ground
background = "#05080d"  # PORTED  terminal + panel ground (eDEX: light_black)
grid       = "#262828"  # PORTED  grid texture behind everything (eDEX: grey)

# ---------------------------------------------------------------------------
# Fonts — locked 2026-10-05, Phase 0. All OFL, all vendored by khadi-fonts.
#
# eDEX's own two slots were United Sans Medium/Light, a commercial House
# Industries face: fine in a GPL source tree, not fine on installable media.
# Substitutions and their reasoning are in PLAN.md section 3.
# ---------------------------------------------------------------------------
[font]
ui       = "Rajdhani"
ui_light = "Rajdhani Light"
mono     = "Iosevka Term"   # 0.500 em advance vs Fira Code's 0.600 — 20% more
                            # columns, which the Phase 0 spike proved scarce
display  = "Orbitron"       # the clock only, on the GTK panel

# Chrome and scale constants are eDEX motifs rather than per-theme taste, so
# khadi-theme supplies them. Override here only to depart from the reference.
#
# tron defines no ANSI 16 — only 9 of 21 upstream themes do. A theme that wants
# syntax hues adds [terminal.ansi]; without it everything collapses onto the
# ramp and brightness carries meaning instead of colour.
