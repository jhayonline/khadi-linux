# Khadi theme — blade
#
# Ported from eDEX-UI src/assets/themes/blade.json. Inputs only.

[meta]
name        = "blade"
description = "eDEX-UI's blade. Burnt orange on black."
upstream    = "eDEX-UI src/assets/themes/blade.json (GPL-3.0)"

[palette]
accent     = "#cc5e37"  # PORTED  rgb(204,94,55)
black      = "#000000"  # PORTED
background = "#090b0a"  # PORTED
grid       = "#262827"  # PORTED

[font]
ui       = "Rajdhani"
ui_light = "Rajdhani Light"
mono     = "Iosevka Term"
display  = "Orbitron"
