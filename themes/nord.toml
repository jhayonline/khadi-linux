# Khadi theme — nord
#
# Ported from eDEX-UI src/assets/themes/nord.json.
#
# This is the theme that is NOT one-colour. It declares a full ANSI 16, so it
# exercises the path the other three leave untested: syntax highlighting in
# Helix and file-type colour in Yazi get a real palette instead of collapsing
# onto the alpha ramp.
#
# It also exercises an upstream inconsistency on purpose. nord spells the
# bright half `light*` while the other eight ANSI-bearing eDEX themes use
# `bright*`. khadi-theme normalises both, so this file is written exactly as
# upstream has it rather than tidied on the way in.

[meta]
name        = "nord"
description = "eDEX-UI's nord. Cool grey-blue, and the one theme with real ANSI."
upstream    = "eDEX-UI src/assets/themes/nord.json (GPL-3.0)"

[palette]
accent     = "#d8dee9"  # PORTED  rgb(216,222,233)
black      = "#3B4252"
background = "#2E3440"
grid       = "#4c566a"

[font]
ui       = "Rajdhani"
ui_light = "Rajdhani Light"
mono     = "Iosevka Term"
display  = "Orbitron"

[terminal.ansi]
black          = "#3B4252"
red            = "#BF616A"
green          = "#A3BE8C"
yellow         = "#EBCB8B"
blue           = "#81A1C1"
magenta        = "#B48EAD"
cyan           = "#88C0D0"
white          = "#E5E9F0"
lightBlack     = "#4C566A"
lightRed       = "#BF616A"
lightGreen     = "#A3BE8C"
lightYellow    = "#EBCB8B"
lightBlue      = "#81A1C1"
lightMagenta   = "#B48EAD"
lightCyan      = "#8FBCBB"
lightWhite     = "#ECEFF4"
