[package]
name = "khadi-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Khadi UI shell — eDEX's layout, as a Tauri app."

[lib]
name = "khadi_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde.workspace = true
serde_json = "1"
anyhow.workspace = true
# The terminal. eDEX used node-pty; this is the same job on the Rust side,
# and it is the one dependency the whole shell actually turns on.
portable-pty = "0.9"
khadi-core = { path = "../../crates/khadi-core" }
